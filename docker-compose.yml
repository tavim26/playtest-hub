services:
  postgres:
    image: postgres:18
    container_name: playtesthub-postgres
    environment:
      POSTGRES_USER: playtesthub
      POSTGRES_PASSWORD: playtesthub
      POSTGRES_DB: playtesthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtesthub -d playtesthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
